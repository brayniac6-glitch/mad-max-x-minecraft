; MadCraft settings. Lives in <Mad Max>\madcraft\MadCraft.ini, next to dinput8.dll's log.

[Minecraft]
; Start Minecraft (the bundled Prism Launcher's MadCraft instance) together with Mad Max.
bStartWithMadMax = 1
; Leave empty for the bundled MadCraft-Minecraft.zip, or point at your own launcher.
sLauncher =
sArguments = --launch MadCraft

[Input]
; DirectInput scan codes (hex) Mad Max keeps while Minecraft drives. 01 = Esc (pause menu).
; F8 always toggles between Minecraft controls and Mad Max controls (use it to drive the Magnum Opus).
sGameKeys = 01
; Cars in Minecraft mode: walk up to a car and press sCarKey (hex DIK; 21 = F) to get in; press it
; again to get out. It presses Mad Max's own get-in / interact key (sMadMaxCarKey, 12 = E) for
; iCarKeyHoldMs, so it also picks things up and opens doors. While in a car, Mad Max's driving
; controls and car camera are used; you're back in Minecraft mode when you get out.
sCarKey = 21
sMadMaxCarKey = 12
iCarKeyHoldMs = 300

[Vehicle]
; Steve's height in a car's seat (blocks, + up), if he sits too high or sinks into the seat.
fSeatOffsetY = 0
; F5 in a car (Minecraft mode): first person from Steve's seat <-> Mad Max's chase camera. Where
; the first-person eyes sit: metres above Max's seated position, and forward of it.
fFirstPersonEyeY = 0.9
fFirstPersonEyeForward = 0

[World]
; Apex units are metres, Y up. Change these only if walking in Minecraft moves Max the wrong way.
fUnitsPerBlock = 1.0
bFlipX = 0
bFlipZ = 0
; 180: Apex characters face -Z of their matrix (first in-game test: S walked forward at 0).
fYawOffsetDeg = 180

[Camera]
; 1: like SkyCraft, Mad Max renders from Minecraft's eyes while Minecraft drives (first person; F5 for
; Minecraft's third-person views, where Steve is drawn). Needs [Hooks] RenderCameraUpdate.
bFirstPerson = 1
; Hide Max's own model while Minecraft drives (Steve replaces him). Needs [Hooks] CharacterDraw*.
bHideMax = 1
; Only with bFirstPerson = 0: Mad Max's own third-person camera sets the look (the mouse turns it, W
; walks where it points); 0 = Minecraft's mouse look with Mad Max's camera left where it is.
bUseGameCamera = 1

[Hooks]
; Hook points in MadMax.exe, found with Ghidra (see sheet/hooks.tsv). Two forms (hex):
;   Name = MadMax.exe+<static address>, <offset>, <offset> ...     pointer chain
;   Name = vtable:MadMax.exe+<class vftable>, <offset>, <offset>   the live object of that C++ class
;          (found by scanning the heap), + first offset, then dereference + each next offset
; Empty = that feature stays off; the overlay still works.
; PlayerMatrix: Max's 4x4 world matrix (floats, row-major, translation at iMatrixTranslationIndex).
; Player manager global 141715FB8 +0x37A8 -> CPlayer, +0x20 -> its CCharacter, whose transform
; interface sits at +0x8 with the world matrix at its +0x1D0 (sheet/hooks.tsv H01). If a game update
; moves the global, the scan form works too: vtable:MadMax.exe+1231A10, 20, 1D8 (CPlayer's vftable).
PlayerMatrix = MadMax.exe+1715FB8, 37A8, 20, 1D8
iMatrixTranslationIndex = 12
; The game's own SetTransform (CCharacter interface at +0x8, vtable slot 20): moves Havok's
; character controller with the matrix, so physics doesn't snap Max back. Empty = write the matrix.
PlayerSetTransform = MadMax.exe+1715FB8, 37A8, 20, 8
iSetTransformSlot = 20
; CameraMatrix: the render camera's world matrix. [141715F90]+0x5E0 is the camera every system
; reads (144 sites; frustum planes at +0x474, view-projection at +0x1D4); its world matrix sits at
; +0x54 (translation at +0x84). Forward row is calibrated at runtime (sheet/hooks.tsv H06).
CameraMatrix = MadMax.exe+1715F90, 5E0, 54
; TimeOfDay: Mad Max's clock (what its GetTimeOfDay script function FUN_140497840 returns), H08.
TimeOfDay = MadMax.exe+1716030, 28
; The render camera's per-frame update FUN_1408926F0(camera, ?, t): interpolates +0x54 between +0x94
; and +0xD4, then builds view (+0x2D4), projection (+0x154), view-projection and frustum. The camera
; driver writes Minecraft's eyes into both ends just before it.
RenderCameraUpdate = MadMax.exe+8926F0
; Character mesh draws: NGraphicsEngine::CRenderBlockCharacter (vftable 14129B878) slots 27 and 28,
; (block, context, instance) with the instance's world matrix at +0x20. Max's are skipped (H13).
CharacterDrawMain = MadMax.exe+8E81B0
CharacterDrawOther = MadMax.exe+8E7C30
; Max's gear (canteen, ...): NGraphicsEngine::CRenderBlockGeneralMM (vftable 141292DA8) slots 27/28,
; skipped only on his body (within 0.6 m, hip to head height).
GearDrawMain = MadMax.exe+8D5D10
GearDrawOther = MadMax.exe+8EE890
; Collision (Phase 1, H05): Mad Max's physics raycast against the static world. PhysicsSystem is the
; global holding CPhysicsSystem*; RaycastFunction = FUN_140849E50(system, tag, ray, min, max, result,
; collector, 0, 0, 0, 0); RaycastStaticFilter = CStaticOnlyRaycastFilter's constructor. Empty = the
; flat Phase 0 floor instead.
PhysicsSystem = MadMax.exe+1715B78
RaycastFunction = MadMax.exe+849E50
RaycastStaticFilter = MadMax.exe+CD2E0
; Preferred collector: CIgnoreCharactersAndVehiclesRaycastFilter (vftable 141242860) on the base
; collector FUN_140808600 - everything but people and cars (ships, wrecks, fences, props). Empty
; either = the static-only filter above (terrain and rocks only).
RaycastFilterBase = MadMax.exe+808600
RaycastFilterVtable = MadMax.exe+1242860
; InVehicle: Max's attachment parent (vehicle seat) pointer; non-null while attached/driving.
InVehicle = MadMax.exe+1715FB8, 37A8, 20, 2820, 60
; Characters (H09): the character manager [141715FB8] keeps every NPC it spawns in a vector at
; +0x10 (begin, end), each entry pointing at the character's +0x1C0. CCharacter: +0x180 max health,
; +0x184 health, +0xE8 dead, +0x1D8 world matrix.
CharacterList = MadMax.exe+1715FB8, 10
; Damage (H10): the CCharacter vtable slot the game's InflictDamage script command calls with a
; CDamageInflictor message (vftable 1411ABB98): health, hit reactions and death, all the game's own.
DamageInflictorVtable = MadMax.exe+11ABB98
iCharacterDamageSlot = 23

[Render]
; Mad Max's frame cap (0 = off). Both games share the GPU: uncapped Mad Max (170 fps) leaves Minecraft
; - your hand, HUD and Steve - at 10-40 fps. Lower it if those still look choppy.
iMaxFps = 90
; Lighting for Minecraft's blocks, Steve and entities, like SkyCraft's: Mad Max's sun for the hour
; (fSunAzimuthDeg turns its east-west path if shadows fall the wrong way), the sky's fill light,
; a soft exposure curve, Minecraft's sky/block light; tinted by the scene's overall colour.
bLighting = 1
bSceneTint = 1
fExposure = 1.6
fSunAzimuthDeg = 0
; Dynamic light: Minecraft's torches, lanterns, glowstone, fire and lava (and a torch in your hand)
; light Mad Max's own world around them, the way Minecraft's light falls off; flames flicker.
bDynamicLights = 1
fTorchIntensity = 1.5
; Lights within this many blocks of the camera (the nearest 48 count).
fLightRange = 48
; Mad Max's darkness on Minecraft: Steve, your hand and held items (bPlayerShade), and placed blocks
; and mobs (bBlockShade) darken in Mad Max's shadows, bunkers and nights. Full light when the frame
; around them is at least fShadeDaylight bright (0-1); raise it to darken sooner.
bPlayerShade = 1
bBlockShade = 1
fShadeDaylight = 0.3
; Floors: the darkest the player (fShadeMin, 0-1) and blocks (fBlockShadeMin) get.
fShadeMin = 0
fBlockShadeMin = 0.08
; Mad Max's haze towards the scene's colour with distance (metres); fFogMax 0 = off.
fFogStart = 60
fFogEnd = 600
fFogMax = 0.6

[Combat]
; Minecraft weapons hurt Mad Max's NPCs. Minecraft works the damage out (wooden sword 4, stone 5,
; iron 6, diamond 7, netherite 8, axes more; crits, Sharpness, Strength and the attack cooldown
; count), and that hit is applied as a share of the NPC's health as if it were a Minecraft mob with
; fNpcMinecraftHealth health: 20 = a zombie (wooden sword: 5 hits, diamond sword: 3).
bEnabled = 1
fNpcMinecraftHealth = 20
; How far (blocks) NPCs are mirrored into Minecraft as hittable stand-ins.
fRange = 48
